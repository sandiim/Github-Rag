[project]
name = "github-repository-rag-backend"
version = "0.1.0"
description = "FastAPI backend for the GitHub Repository RAG application"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "fastapi",
    "pgvector",
    "pydantic-settings",
    "psycopg[binary]",
    "sqlalchemy",
    "uvicorn[standard]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
